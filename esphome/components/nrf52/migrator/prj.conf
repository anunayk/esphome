# fw1 -> fw2 (Option B) migrator -- standalone Zephyr app.
#
# This app is built ONCE, offline, into a prebuilt base binary (see README.md);
# the ESPHome build only patches the embedded fw2-bootloader blob into it. Keep
# it tiny and self-contained -- it must fit fw1's single application slot
# (0x78000) with the 48 KiB blob, and its critical section runs from RAM with
# IRQs off.

# No console/logging/printk: smaller image, no UART dependency.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_SERIAL=n

# CRITICAL (BOOTLOADER_UPDATER_PLAN.md 6.3): never start the watchdog. The
# nRF52 WDT cannot be stopped once running and the RAM critical section runs
# for many seconds with IRQs disabled, so it must not exist to expire.
CONFIG_WATCHDOG=n

# The critical erase/program/UICR routine executes from RAM (__ramfunc) because
# it erases the flash it was loaded from. ARCH_HAS_RAMFUNC_SUPPORT is a
# promptless symbol auto-selected by the Cortex-M arch -- it must NOT be assigned
# here (NCS Kconfig errors out when a selected/promptless symbol is assigned).

# CRC for blob integrity checking before the critical section.
CONFIG_CRC=y

# No USB stack: the migrator needs no host interaction; it runs and resets.
CONFIG_USB_DEVICE_STACK=n

# Headered for fw1's single-slot MCUboot (hash-only, signature type none -- see
# BOOTLOADER_UPDATER_PLAN.md 5). The image-signing step still needs a key file
# even though the bootloader does not verify it.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="root-ec-p256.pem"

# Use newlib, matching the libc the normal ESPHome Zephyr build selects
# (components/zephyr/__init__.py). The platform's Zephyr SDK toolchain
# (arm-zephyr-eabi) otherwise defaults to picolibc, whose headers conflict with
# this NCS framework-zephyr's libc-hooks.c and fail to compile.
CONFIG_NEWLIB_LIBC=y

# Keep the toolchain/libc minimal.
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_GPIO=n
CONFIG_REBOOT=y
