# Partition layout for the OFFLINE standalone build of the migrator app
# (see README.md "Building the prebuilt base"). NCS Partition Manager auto-loads
# this file from the application source directory.
#
# It MUST match fw1's usb_cdc_recovery layout so the migrator's vector table is
# linked for fw1's single application slot. fw1's MCUboot loads the migrator at
# the start of that slot (0x1000 + image header); if the image were linked for
# any other slot (e.g. the default xiao_ble MCUboot slot at 0xC000), the vector
# table addresses would be wrong and the migrator would fault instead of run.
#
# The 0x1000..0x79000 gap auto-fills as mcuboot_primary (the app slot the
# migrator is uploaded into and runs from). Keep in sync with the
# usb_cdc_recovery pm_static in ../__init__.py.
mbr:
  address: 0x0
  end_address: 0x1000
  region: flash_primary
  size: 0x1000
mcuboot_secondary:
  address: 0x79000
  end_address: 0xF1000
  region: flash_primary
  size: 0x78000
settings_storage:
  address: 0xF1000
  end_address: 0xF4000
  region: flash_primary
  size: 0x3000
mcuboot:
  address: 0xF4000
  end_address: 0xFD800
  region: flash_primary
  size: 0x9800
empty_adafruit_bl_config_page:
  address: 0xFD800
  end_address: 0xFE000
  region: flash_primary
  size: 0x800
empty_mbr_params_page:
  address: 0xFE000
  end_address: 0xFF000
  region: flash_primary
  size: 0x1000
empty_adafruit_bl_settings_page:
  address: 0xFF000
  end_address: 0x100000
  region: flash_primary
  size: 0x1000
