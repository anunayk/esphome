# nRF54L15 uses hash-only validation and overwrite-only updates.
# Recovery uses SWD. The chip has no USB.
# Replace SDK defaults that require an RTC timer or enabled boot logging.
CONFIG_PM=n
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_FLASH=y
CONFIG_SPI_NOR=n
CONFIG_CBPRINTF_NANO=y
CONFIG_MINIMAL_LIBC=y
CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n
CONFIG_BOOT_BOOTSTRAP=n
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_SINGLE_APPLICATION_SLOT=n
CONFIG_MCUBOOT_SERIAL=n
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=256
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_BUILD_OUTPUT_UF2=n
CONFIG_BOOT_WATCHDOG_FEED=n
CONFIG_FPROTECT=n
