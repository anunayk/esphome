# fw2 MCUboot for the Option B migrator path (mcuboot child image).
#
# A TWO-slot swap bootloader (so BLE/USB OTA works), RELOCATED to 0x1000 -- the
# relocation comes from the `mcuboot` partition placement in pm_static, not from
# this file. It must fit the 0xC000 (48 KiB) bootloader budget at 0x1000, so it
# uses hash-only validation (signature type none) like fw1.
#
# It also keeps a USB-CDC serial-recovery interface: after migration fw2 comes
# up with an empty primary slot and drops into recovery, where the real app is
# uploaded. The USB/serial settings mirror the proven fw1 recovery config
# (xiao_ble_mcuboot_usb_cdc_recovery.conf) -- see the memory notes
# nrf52-usb-cdc-recovery-mbr-bug.
#
# HARDWARE-PENDING: validate the relocated two-slot image boots and enters
# recovery on real silicon (BOOTLOADER_UPDATER_PLAN.md section 8) before relying
# on it.

CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_HW_CC3XX=n
CONFIG_BOOT_BANNER=n

# Two-slot swap, no scratch partition (matches the equal primary/secondary
# layout in pm_static; no scratch region is reserved).
CONFIG_SINGLE_APPLICATION_SLOT=n
CONFIG_BOOT_SWAP_USING_MOVE=y
CONFIG_BOOT_UPGRADE_ONLY=n

# Hash-only validation to fit the 0xC000 budget.
CONFIG_BOOT_SIGNATURE_TYPE_NONE=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="root-ec-p256.pem"
CONFIG_BOOT_VALIDATE_SLOT0=y

# USB-CDC serial recovery (empty primary -> upload the real app). These mirror
# the validated fw1 recovery config; the USB_DEVICE_INITIALIZE_AT_BOOT=n and
# BOOT_MAX_LINE_INPUT_LEN/LINE_BUFS settings are the load-bearing fixes.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=n
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_BOOT_SERIAL_UNALIGNED_BUFFER_SIZE=32
CONFIG_BOOT_MAX_LINE_INPUT_LEN=512
CONFIG_BOOT_LINE_BUFS=2
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=512
CONFIG_BOOT_SERIAL_IMG_GRP_HASH=n
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU_TIMEOUT=30000
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_BOOT_ERASE_PROGRESSIVELY=y
CONFIG_BOOT_WATCHDOG_FEED=n

# Trim footprint to fit the budget.
CONFIG_MCUBOOT_NRF_CLEANUP_PERIPHERAL=n
CONFIG_MCUBOOT_CLEANUP_ARM_CORE=n
CONFIG_MCUBOOT_CLEANUP_UNUSABLE_SECONDARY=n
CONFIG_FPROTECT=n
CONFIG_TIMESLICING=n
CONFIG_TIMEOUT_64BIT=n
CONFIG_MINIMAL_LIBC_MALLOC=n
CONFIG_MINIMAL_LIBC_CALLOC=n
CONFIG_MINIMAL_LIBC_REALLOCARRAY=n
CONFIG_MINIMAL_LIBC_TIME=n
CONFIG_ZCBOR_MAX_STR_LEN=96
CONFIG_USB_MAX_NUM_TRANSFERS=2
CONFIG_USB_NRFX_EVT_QUEUE_SIZE=8
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=256
CONFIG_CBPRINTF_FULL_INTEGRAL=n
CONFIG_CBPRINTF_REDUCED_INTEGRAL=y
CONFIG_CBPRINTF_LIBC_SUBSTS=n
