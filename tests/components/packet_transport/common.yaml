wifi:
  ssid: MySSID
  password: password1

udp:
  listen_address: 239.0.60.53
  addresses: ["239.0.60.53"]

packet_transport:
  platform: udp
  update_interval: 5s
  encryption: "our key goes here"
  rolling_code_enable: true
  ping_pong_enable: true
  binary_sensors:
    - binary_sensor_id1
    - id: binary_sensor_id1
      broadcast_id: other_id
  sensors:
    - sensor_id1
    - id: sensor_id1
      broadcast_id: other_id
  providers:
    - name: some-device-name
      encryption: "their key goes here"

sensor:
  - platform: template
    id: sensor_id1
  - platform: packet_transport
    provider: some-device-name
    id: our_id
    remote_id: some_sensor_id

binary_sensor:
  - platform: packet_transport
    provider: unencrypted-device
    id: other_binary_sensor_id
  - platform: packet_transport
    provider: some-device-name
    type: status
    name: Some-Device Status
  - platform: template
    id: binary_sensor_id1

# Exercise the runtime provider-management actions.
interval:
  - interval: 60s
    then:
      - packet_transport.add_provider:
          name: runtime-peer
      - packet_transport.add_provider:
          name: keyed-runtime-peer
          encryption_key: !lambda 'return std::vector<uint8_t>(32, 0xAB);'
      - packet_transport.remove_provider:
          name: runtime-peer
      - packet_transport.set_provider:
          sensor: our_id
          provider: keyed-runtime-peer
      - packet_transport.set_provider:
          binary_sensor: other_binary_sensor_id
          provider: !lambda 'return "keyed-runtime-peer";'
